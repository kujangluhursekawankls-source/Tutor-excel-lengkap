<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5329" />
      <stop offset="50%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#199252" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="excelGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#0d6133" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle grid lines -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="4">
    <line x1="120" y1="0" x2="120" y2="512" />
    <line x1="240" y1="0" x2="240" y2="512" />
    <line x1="360" y1="0" x2="360" y2="512" />
    <line x1="0" y1="130" x2="512" y2="130" />
    <line x1="0" y1="260" x2="512" y2="260" />
    <line x1="0" y1="390" x2="512" y2="390" />
  </g>

  <!-- Sheet Card in background -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="110" width="220" height="290" rx="20" fill="url(#cardGrad)" />
    
    <!-- Table Header inside sheet -->
    <rect x="200" y="135" width="180" height="26" rx="6" fill="#107c41" opacity="0.9" />
    
    <!-- Table Rows -->
    <rect x="200" y="175" width="50" height="18" rx="4" fill="#cbd5e1" />
    <rect x="260" y="175" width="120" height="18" rx="4" fill="#94a3b8" />

    <rect x="200" y="205" width="50" height="18" rx="4" fill="#cbd5e1" />
    <rect x="260" y="205" width="80" height="18" rx="4" fill="#34d399" opacity="0.8" />

    <rect x="200" y="235" width="50" height="18" rx="4" fill="#cbd5e1" />
    <rect x="260" y="235" width="110" height="18" rx="4" fill="#94a3b8" />

    <rect x="200" y="265" width="50" height="18" rx="4" fill="#cbd5e1" />
    <rect x="260" y="265" width="95" height="18" rx="4" fill="#34d399" opacity="0.8" />

    <!-- Mini chart bars at the bottom of sheet -->
    <rect x="205" y="340" width="24" height="40" rx="4" fill="#107c41" />
    <rect x="240" y="315" width="24" height="65" rx="4" fill="#199252" />
    <rect x="275" y="300" width="24" height="80" rx="4" fill="#22c55e" />
    <rect x="310" y="325" width="24" height="55" rx="4" fill="#107c41" />
    <rect x="345" y="290" width="24" height="90" rx="4" fill="#16a34a" />
  </g>

  <!-- Excel 'X' Badge overlay -->
  <g filter="url(#dropShadow)">
    <rect x="110" y="170" width="170" height="170" rx="28" fill="url(#excelGreen)" stroke="#ffffff" stroke-width="4" stroke-opacity="0.3" />
    
    <!-- Letter X -->
    <path d="M 148 205 L 180 205 L 195 240 L 210 205 L 242 205 L 212 255 L 245 305 L 213 305 L 195 268 L 177 305 L 145 305 L 178 255 Z" fill="#ffffff" />
  </g>

  <!-- Pro Badge Ribbon -->
  <rect x="290" y="75" width="95" height="32" rx="16" fill="#f59e0b" filter="url(#dropShadow)" />
  <text x="337" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PRO</text>
</svg>
